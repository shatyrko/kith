[package]
name = "kith"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A modern address book for Linux that syncs with Google Contacts."

[lib]
name = "kith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kith-core = { path = "../crates/kith-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# set by `tauri build`; a plain `cargo build --features custom-protocol` embeds ../dist too
custom-protocol = ["tauri/custom-protocol"]
