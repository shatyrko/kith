[package]
name = "kith-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Contact model, vCard, storage, search and Google sync for Kith."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
